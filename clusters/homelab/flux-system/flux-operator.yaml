# Bootstrap installs the operator with Helm once. This HelmRelease takes over the
# same release, so upgrades go through git. Keep the tag in sync with bootstrap/bootstrap.sh.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.64.0
    digest: sha256:bfa2e5544943ae2430874f6cb3a25609c83e950207d34987b81b867a31503ca3
  # Keyless cosign signature from ControlPlane's GitHub Actions release workflow.
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/controlplaneio-fluxcd/.*$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 1h
  releaseName: flux-operator
  chartRef:
    kind: OCIRepository
    name: flux-operator
