# Answers 200 "ok" on every path and method, and serves nothing else.
# Everything nginx writes goes to /tmp, the only writable path.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 64;
}

http {
  # Probed every 30s by blackbox and every 5 min by UptimeRobot; not worth logging.
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080 default_server;
    default_type text/plain;

    location / {
      # The zone caches responses at the Cloudflare edge. A cached ok would hide an outage, so every check has to reach the pod.
      add_header Cache-Control no-store always;
      return 200 "ok\n";
    }
  }
}
