# /data holds settings.json (the app writes to it), frame.png and the name lists, owned by uid 1000, the image's user.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fugleramme-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fugleramme
spec:
  # One writer per data volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fugleramme
  template:
    metadata:
      labels:
        app: fugleramme
    spec:
      containers:
        - name: fugleramme
          image: ghcr.io/arnegiacomo/fugleramme:0.32.0@sha256:72e342c493dffe8b18088debabe9df72a72f8ace5f87dfd6e65c14962f4358b7
          env:
            - name: TZ
              value: Europe/Oslo
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fugleramme-data
---
# Port 8080, so the tunnel config reaches it at http://fugleramme:8080.
apiVersion: v1
kind: Service
metadata:
  name: fugleramme
spec:
  selector:
    app: fugleramme
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fugleramme
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
  hostnames:
    - fugleramme-pi5.home.arpa
  rules:
    - backendRefs:
        - name: fugleramme
          port: 8080
