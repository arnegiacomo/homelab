# The items are created by scripts/op-items.sh.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kaneo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kaneo
  data:
    - secretKey: postgres-password
      remoteRef:
        key: kaneo-postgres/password
    - secretKey: auth-secret
      remoteRef:
        key: kaneo-auth-secret/password
