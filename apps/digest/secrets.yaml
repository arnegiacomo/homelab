# The items are created by hand, see docs/secrets.md. The GitHub token is shared by all digests.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: digest
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: digest
  data:
    - secretKey: discord-home-webhook
      remoteRef:
        key: discord-home-webhook/credential
    - secretKey: discord-repos-webhook
      remoteRef:
        key: discord-repos-webhook/credential
    - secretKey: discord-birds-webhook
      remoteRef:
        key: discord-birds-webhook/credential
    - secretKey: github-token
      remoteRef:
        key: github-digest-token/credential
