# Serves the digests' tile values, /<name>.json from the ConfigMap digest-latest, to Homepage's customapi widgets
# (apps/homepage/config/services.yaml). Only inside the cluster, so there is no route. The ConfigMap is mounted as a
# directory, not with subPath, so a job's update shows up in the pod within about a minute.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: digest-web
spec:
  selector:
    matchLabels:
      app: digest-web
  template:
    metadata:
      labels:
        app: digest-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31.7-alpine-slim@sha256:a8cb0f33d51fa107c96fd2bd3a71aaf564ec131e9d2bdf8700944f0ed8b170d7
          # Skips the image's entrypoint scripts, which rewrite files under /etc/nginx.
          command: [nginx, -g, "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          # TCP, since a tile's JSON is missing until its digest first runs.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: web
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: latest
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: web
          configMap:
            name: digest-web
        - name: latest
          configMap:
            name: digest-latest
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: digest-web
spec:
  selector:
    app: digest-web
  ports:
    - name: http
      port: 8080
      targetPort: http
