# Serves the digests' tile values, /<name>.json from the ConfigMap digest-latest, to Homepage's customapi widgets
# (apps/homepage/config/services.yaml), inside the cluster. The ConfigMap is mounted as a directory, not with subPath,
# so a job's update shows up in the pod within about a minute.
# It also serves the weekly advice report, /advice.html from the PVC digest-advice, which is the only path with a route.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: digest-web
spec:
  selector:
    matchLabels:
      app: digest-web
  template:
    metadata:
      labels:
        app: digest-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31.7-alpine-slim@sha256:a8cb0f33d51fa107c96fd2bd3a71aaf564ec131e9d2bdf8700944f0ed8b170d7
          # Skips the image's entrypoint scripts, which rewrite files under /etc/nginx.
          command: [nginx, -g, "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          # TCP, since a tile's JSON is missing until its digest first runs.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: web
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: latest
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: advice
              mountPath: /advice
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: advice
          persistentVolumeClaim:
            claimName: digest-advice
            readOnly: true
        - name: web
          configMap:
            name: digest-web
        - name: latest
          configMap:
            name: digest-latest
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: digest-web
spec:
  selector:
    app: digest-web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Only the report: the tile values stay inside the cluster. It has no Homepage tile, the Discord post links to it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: digest-web
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
  hostnames:
    - digest.home.arpa
  rules:
    - matches:
        - path:
            type: Exact
            value: /advice.html
      backendRefs:
        - name: digest-web
          port: 8080
