apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: digest
resources:
  - namespace.yaml
  - secrets.yaml
  - digests.yaml
  - web.yaml
# The CronJobs only differ in schedule, command and env, so the rest of the pod is written once, as a strategic merge
# patch on every CronJob. Containers and env merge by name. A patch rather than a component or a generator keeps every
# file plain Kubernetes YAML, which Renovate's kubernetes manager reads, so it still bumps the image in cronjob.yaml.
patches:
  - path: cronjob.yaml
    target:
      kind: CronJob
  # After the shared patch, which sets the deadline for every CronJob.
  - target:
      kind: CronJob
      name: fugleramme-advice
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/activeDeadlineSeconds
        value: 3600
configMapGenerator:
  # The hash suffix makes a code change reach the next run, and an nginx change roll the pod.
  - name: digest-code
    files:
      - src/common.ts
      - src/apis.ts
      - src/output.ts
      - src/home.ts
      - src/repo.ts
      - src/advice.ts
      - src/goals.md
      - src/birds.ts
      - src/birdnet.ts
      - src/birdnet-proxy.ts
  - name: digest-web
    files:
      - web/nginx.conf
