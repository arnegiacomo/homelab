apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: prometheus-blackbox-exporter
  namespace: monitoring
spec:
  interval: 1h
  url: oci://ghcr.io/prometheus-community/charts/prometheus-blackbox-exporter
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 11.20.2
    digest: sha256:dff2a707004310c712745e884f548c4c63e6af43be14b831673b519b530c0fe8
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: prometheus-blackbox-exporter
  values:
    # The Probes in infrastructure/monitoring-config reach the exporter at blackbox-exporter.monitoring:9115.
    fullnameOverride: blackbox-exporter
    # Lets the non-root exporter send ICMP through unprivileged ping sockets, so it needs no NET_RAW.
    # ping_group_range is a namespaced safe sysctl, allowed without kubelet flags.
    podSecurityContext:
      sysctls:
        - name: net.ipv4.ping_group_range
          value: "0 2147483647"
    config:
      modules:
        # Follows redirects, so birdnet-go's 302 to /ui/dashboard and the UI login redirects count as up
        # when the page they land on answers 2xx.
        http_2xx:
          prober: http
          timeout: 5s
          http:
            # The frame app answers HTTP/1.0. Helm merges these values over the chart default, which lists only 1.1 and 2.0.
            valid_http_versions: ["HTTP/1.0", "HTTP/1.1", "HTTP/2.0"]
            follow_redirects: true
            preferred_ip_protocol: ip4
        icmp:
          prober: icmp
          timeout: 5s
          icmp:
            preferred_ip_protocol: ip4
        # Pi-hole's local records.
        dns_home_arpa:
          prober: dns
          timeout: 5s
          dns:
            preferred_ip_protocol: ip4
            query_name: homelab.home.arpa
            query_type: A
            valid_rcodes: [NOERROR]
            validate_answer_rrs:
              fail_if_none_matches_regexp: ['\s192\.168\.142\.2$']
        # A Wyoming server (Whisper, Piper) answers its describe request with info. blackbox adds the newline the
        # protocol needs after the JSON header.
        wyoming:
          prober: tcp
          timeout: 5s
          tcp:
            preferred_ip_protocol: ip4
            query_response:
              - send: '{"type": "describe"}'
              - expect: '"type": ?"info"'
        # Recursion through unbound.
        dns_external:
          prober: dns
          timeout: 5s
          dns:
            preferred_ip_protocol: ip4
            query_name: example.com
            query_type: A
            valid_rcodes: [NOERROR]
            validate_answer_rrs:
              fail_if_none_matches_regexp: ['\sA\s']
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
