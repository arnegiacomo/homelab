apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-admin
  # Key names are the Grafana chart's defaults for admin.existingSecret.
  data:
    - secretKey: admin-user
      remoteRef:
        key: grafana-admin/username
    - secretKey: admin-password
      remoteRef:
        key: grafana-admin/password
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Grafana
    gethomepage.dev/description: Dashboards and alerts
    gethomepage.dev/group: Cluster
    gethomepage.dev/icon: grafana.png
    gethomepage.dev/app: grafana
    gethomepage.dev/widget.type: grafana
    gethomepage.dev/widget.version: "2"
    gethomepage.dev/widget.alerts: alertmanager
    # Leaves out datasources and totalalerts, which counts Grafana-managed alert rules. There are none, the rules are in Prometheus.
    gethomepage.dev/widget.fields: '["dashboards", "alertstriggered"]'
    gethomepage.dev/widget.url: http://kube-prometheus-stack-grafana.monitoring
    gethomepage.dev/widget.username: "{{HOMEPAGE_VAR_GRAFANA_USERNAME}}"
    gethomepage.dev/widget.password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
  hostnames:
    - grafana.home.arpa
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
