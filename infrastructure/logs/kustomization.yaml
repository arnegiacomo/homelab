apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - loki.yaml
  - alloy.yaml
  - grafana-datasource.yaml
# Fixed name, so the Alloy chart can reference it. Its config-reloader sidecar picks up changes.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: alloy-config
    namespace: monitoring
    files:
      - config.alloy
