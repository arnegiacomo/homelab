# The Flux Operator serves its read-only web UI on 9080. Its chart ships a NetworkPolicy that admits it from all namespaces.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-web
  namespace: flux-system
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Flux
    gethomepage.dev/description: GitOps
    gethomepage.dev/group: Cluster
    gethomepage.dev/icon: flux-cd.png
    gethomepage.dev/app: flux-operator
    # Counts of Flux objects from the Flux Operator's flux_resource_info. Ready shows the query returns data, so a 0 in
    # Failing means nothing is failing rather than no data. Homepage turns the numeric path segments into a list.
    gethomepage.dev/widget.type: prometheusmetric
    gethomepage.dev/widget.url: http://kube-prometheus-stack-prometheus.monitoring:9090
    gethomepage.dev/widget.refreshInterval: "30000"
    gethomepage.dev/widget.metrics.0.label: Ready
    gethomepage.dev/widget.metrics.0.query: count(flux_resource_info{ready="True"})
    gethomepage.dev/widget.metrics.1.label: Failing
    gethomepage.dev/widget.metrics.1.query: count(flux_resource_info{ready="False"}) or vector(0)
spec:
  parentRefs:
    - name: homelab
      namespace: traefik
  hostnames:
    - flux.home.arpa
  rules:
    - backendRefs:
        - name: flux-operator
          port: 9080
