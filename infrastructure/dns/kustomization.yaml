apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - unbound.yaml
  - pihole.yaml
  - coredns-custom.yaml
configMapGenerator:
  # The hash suffix makes an adlist change roll the Pi-hole pod, whose start script applies it to gravity.
  - name: pihole-adlists
    namespace: dns
    files:
      - adlists.list
  - name: pihole-start
    namespace: dns
    files:
      - pihole-start.sh
