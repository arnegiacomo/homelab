# k3s's CoreDNS imports *.server keys from this ConfigMap, so pods resolve home.arpa through Pi-hole.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  home-arpa.server: |
    home.arpa:53 {
        errors
        cache 30
        forward . 192.168.142.2
    }
