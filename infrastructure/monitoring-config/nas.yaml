# node_exporter on the NAS (docs/nas.md). By IP, like the probes, so a Pi-hole outage doesn't also cut the metrics.
# The chart's node rules select job="node-exporter", so they don't apply to this job. Of the homelab rules,
# NodeDiskUsageHigh and NodeTemperatureHigh match it, for the SD card and the SoC. The NAS rules are in alerts.yaml.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: nas
  namespace: monitoring
spec:
  jobName: nas
  staticConfigs:
    - targets:
        - 192.168.142.7:9100
      labels:
        instance: nas
