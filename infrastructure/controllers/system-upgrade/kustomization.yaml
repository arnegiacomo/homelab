# Rancher's system-upgrade-controller, from its release manifests. The repo's own kustomization.yaml pins a stale
# image tag, so the release assets are the source. Bump both URLs and the image together (Renovate does).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/rancher/system-upgrade-controller/releases/download/v0.21.1/crd.yaml
  - https://github.com/rancher/system-upgrade-controller/releases/download/v0.21.1/system-upgrade-controller.yaml
# Pins the release manifest's image by digest.
images:
  - name: rancher/system-upgrade-controller
    newTag: v0.21.1@sha256:14636476f2801b9b6556dd4942f3e2371e8ac9e2b33986d5a59b742bc35f5152
