# Rancher's system-upgrade-controller, from its release manifests. The repo's own kustomization.yaml pins a stale
# image tag, so the release assets are the source. Bump both URLs and the image together (Renovate does).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/rancher/system-upgrade-controller/releases/download/v0.21.0/crd.yaml
  - https://github.com/rancher/system-upgrade-controller/releases/download/v0.21.0/system-upgrade-controller.yaml
# Pins the release manifest's image by digest.
images:
  - name: rancher/system-upgrade-controller
    newTag: v0.21.0@sha256:52f31eb3f2dcd3c937c8390bcb90d8a7f019832d9b131690a51c3f95decad443
